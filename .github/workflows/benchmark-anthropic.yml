name: Manual Anthropic benchmark

on:
  workflow_dispatch:
    inputs:
      attempts:
        description: Attempts per lab case (1-100)
        required: true
        type: number
        default: 5

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run sandbox:build
      - run: npm test
        env:
          PATCHPROOF_DOCKER_INTEGRATION: '1'
      - name: Run Anthropic benchmark
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BENCHMARK_ATTEMPTS: ${{ inputs.attempts }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY repository secret is required."
            exit 1
          fi
          npm run bench -- --provider anthropic --attempts "$BENCHMARK_ATTEMPTS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anthropic-benchmark-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
